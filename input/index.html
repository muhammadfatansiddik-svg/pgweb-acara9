<!DOCTYPE html>
<html>
<head>
    <title>Form Input Data</title>
</head>
<body>
    <h2>Form Input</h2>
    <form action="input.php" onsubmit="return validateForm()" method="post">
        <label for="wilayah">Wilayah:</label><br>
        <input type="text" id="wilayah" name="wilayah" value="" required><br>

        <label for="kecamatan">Kecamatan:</label><br>
        <input type="text" id="kecamatan" name="kecamatan" value="" required><br>
        
        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" name="nama" value="" required><br>

        <label for="jenis">Jenis:</label><br>
        <input type="text" id="jenis" name="jenis" value="" required><br>

        <label for="longitude">Longitude:</label><br>
        <input type="text" id="longitude" name="longitude" value="" required><br>

        <label for="latitude">Latitude:</label><br>
        <input type="text" id="latitude" name="latitude" value="" required><br><br>

        <input type="submit" value="Submit">
    </form>
    
    <p id="informasi" style="color:red; font-weight:bold;"></p>
    
    <script>
        function validateForm() {
            let lon = document.getElementById("longitude").value;
            let lat = document.getElementById("latitude").value;
            let text = "";
            
            if (isNaN(lon) || isNaN(lat) || lon.trim() === "" || lat.trim() === "") {
                text = "Data longitude dan latitude harus berupa angka valid!";
                document.getElementById("informasi").innerHTML = text;
                // stop the form submission
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
